<!doctype html>
<!-- "N Skills In One Install" banner for the README. The number is read from ?n= (default 16).
     Render: node scripts/render.mjs still --html docs/skills-banner.html --out docs/skills-banner.png --width 680 --height 128 --scale 2 --transparent -->
<html>
<head>
<meta charset="utf-8">
<title>skills banner</title>
<style>
  html, body { margin: 0; background: transparent; }
  .banner { box-sizing: border-box; width: 680px; height: 128px; border: 4px solid #0E9F8A; border-radius: 22px;
            background: linear-gradient(100deg, #F2FBF9 0%, #FFF7E8 100%); display: flex; align-items: center;
            padding: 0 30px 0 22px; gap: 26px; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  .seal { position: relative; width: 92px; height: 92px; flex: none; }
  .seal svg { position: absolute; inset: 0; }
  .seal .n { position: absolute; left: 0; right: 0; top: 0; height: 88px; display: flex; align-items: center; justify-content: center;
             font: 800 32px/1 "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: #0B1020; }
  .txt { flex: 1; text-align: center; }
  .kicker { font-weight: 700; font-size: 15px; letter-spacing: 0.2em; color: #0E9F8A; white-space: nowrap; }
  .big { margin-top: 8px; font-weight: 800; font-size: 34px; color: #0B1020; }
  .big b { color: #C97A00; }
</style>
</head>
<body>
<div class="banner">
  <div class="seal">
    <svg viewBox="0 0 92 92" width="92" height="92">
      <g fill="#0E9F8A">
        <path d="M14,70 q-12,-22 -4,-48 q8,22 4,48z"/><path d="M20,80 q-18,-6 -20,-26 q14,10 20,26z"/>
        <path d="M78,70 q12,-22 4,-48 q-8,22 -4,48z"/><path d="M72,80 q18,-6 20,-26 q-14,10 -20,26z"/>
      </g>
      <circle cx="46" cy="44" r="33" fill="#FFFFFF" stroke="#0E9F8A" stroke-width="4"/>
      <circle cx="46" cy="44" r="26" fill="none" stroke="#FFB020" stroke-width="3" stroke-dasharray="4 5"/>
    </svg>
    <div class="n" id="n">16</div>
  </div>
  <div class="txt">
    <div class="kicker">CLAUDE CODE PLUGIN · AI PRODUCER HARNESS</div>
    <div class="big"><b id="n2">16</b> Skills In One Install</div>
  </div>
</div>
<script>
  const n = new URLSearchParams(location.search).get('n');
  if (n) { document.getElementById('n').textContent = n; document.getElementById('n2').textContent = n; }
  window.__ready = true;
</script>
</body>
</html>
